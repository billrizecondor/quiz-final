<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Bee Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Quiz Bee</p>
          <h1 id="gameTitle">Championship Board</h1>
        </div>
        <div class="top-actions" aria-label="Game controls">
          <button class="icon-button" id="editToggle" type="button" title="Edit board" aria-label="Edit board">
            <span aria-hidden="true">Edit</span>
          </button>
          <button class="icon-button" id="resetBoard" type="button" title="Reset answered clues" aria-label="Reset answered clues">
            <span aria-hidden="true">Reset</span>
          </button>
          <button class="icon-button danger" id="resetGame" type="button" title="Reset game" aria-label="Reset game">
            <span aria-hidden="true">Clear</span>
          </button>
        </div>
      </header>

      <section class="score-strip" id="teams" aria-label="Teams"></section>

      <section class="board-wrap" aria-label="Quiz board">
        <div class="board" id="board"></div>
      </section>
    </main>

    <dialog class="clue-dialog" id="clueDialog">
      <div class="clue-panel">
        <div class="clue-meta">
          <span id="clueCategory"></span>
          <strong id="cluePoints"></strong>
        </div>
        <div class="timer-row">
          <progress id="timerBar" value="30" max="30"></progress>
          <span id="timerText">30</span>
        </div>
        <div class="clue-body">
          <img class="clue-image" id="clueImage" alt="Question clue image" hidden />
          <p id="clueQuestion"></p>
          <p class="answer" id="clueAnswer" hidden></p>
          <p class="trivia" id="clueTrivia" hidden></p>
        </div>
        <div class="modal-actions">
          <button id="startTimer" type="button">Start</button>
          <button id="revealAnswer" type="button">Reveal</button>
          <button id="closeClue" type="button">Board</button>
        </div>
        <div class="award-grid" id="awardGrid"></div>
      </div>
    </dialog>

    <aside class="editor" id="editor" aria-label="Board editor" aria-hidden="true">
      <div class="editor-head">
        <div>
          <p class="eyebrow">Editor</p>
          <h2>Board Setup</h2>
        </div>
        <button class="icon-button" id="closeEditor" type="button" title="Close editor" aria-label="Close editor">
          <span aria-hidden="true">x</span>
        </button>
      </div>

      <label>
        Game title
        <input id="titleInput" type="text" />
      </label>

      <div class="team-editor">
        <div class="section-head">
          <h3>Teams</h3>
          <button id="addTeam" type="button">Add</button>
        </div>
        <div id="teamFields"></div>
      </div>

      <div class="category-editor">
        <div class="section-head">
          <h3>Categories</h3>
          <button id="addCategory" type="button">Add</button>
        </div>
        <div id="categoryFields"></div>
      </div>

      <div class="editor-actions">
        <button id="saveEdits" type="button">Save</button>
        <button id="exportCsv" type="button">Export CSV</button>
        <label class="file-button">
          Import CSV
          <input id="importCsv" type="file" accept=".csv,text/csv" />
        </label>
        <button id="exportData" type="button">Export JSON</button>
        <label class="file-button">
          Import JSON
          <input id="importData" type="file" accept="application/json" />
        </label>
      </div>
      <p class="editor-note">CSV columns: category, points, question, answer, image, trivia</p>
    </aside>

    <template id="categoryTemplate">
      <details class="category-card" open>
        <summary>
          <input class="category-name" type="text" />
          <button class="remove-category" type="button" title="Remove category" aria-label="Remove category">x</button>
        </summary>
        <div class="clue-edit-list"></div>
      </details>
    </template>

    <template id="clueTemplate">
      <div class="clue-edit">
        <input class="clue-points" type="number" min="0" step="100" aria-label="Points" />
        <textarea class="clue-question" rows="2" aria-label="Question"></textarea>
        <textarea class="clue-answer" rows="2" aria-label="Answer"></textarea>
        <textarea class="clue-trivia" rows="2" aria-label="Trivia" placeholder="Trivia shown after reveal"></textarea>
        <div class="image-edit">
          <input class="clue-image-url" type="text" aria-label="Image URL or uploaded image data" placeholder="Image URL or uploaded image" />
          <div class="image-actions">
            <label class="file-button mini-file-button">
              Choose Image
              <input class="clue-image-file" type="file" accept="image/*" />
            </label>
            <button class="clear-image" type="button">Clear Image</button>
          </div>
          <img class="image-preview" alt="Clue image preview" hidden />
        </div>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
